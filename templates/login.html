<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nginx Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-emerald-950 border border-emerald-800 text-emerald-400 rounded-full mb-3">
        🔒
      </div>
      <h1 class="text-xl font-bold">Nginx Control Portal</h1>
      <p class="text-xs text-gray-400 mt-1">Masukkan password akses server</p>
    </div>

    {% if error %}
    <div class="mb-4 p-2.5 bg-rose-950/60 border border-rose-800 text-rose-300 rounded text-xs text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-400 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autofocus 
          placeholder="••••••••" 
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 font-mono"
        >
      </div>
      <button 
        type="submit" 
        class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-bold transition shadow-md"
      >
        Masuk
      </button>
    </form>
  </div>
</body>
</html>
